<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pratinjau maskot bertekstur</title><style>body{margin:0;background:#e9e6df;color:#252724;font:15px system-ui}canvas{display:block}header{position:absolute;left:24px;top:20px;pointer-events:none}h1{font-size:22px;margin:0 0 8px}p{margin:0;color:#5b6058}nav{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px}button,a{border:1px solid #cbcfc4;background:#fff;padding:12px 18px;border-radius:12px;color:inherit;font:inherit;cursor:pointer;text-decoration:none}button:hover{background:#ffdb62}#status{position:absolute;right:24px;top:24px;font-size:13px}</style><header><h1>Maskot · baju & batik</h1><p>Geser untuk memutar · gulir untuk memperbesar</p></header><div id="status">Memuat model…</div><nav><button data-view="front">Depan</button><button data-view="side">Samping</button><button data-view="back">Belakang</button><a href="maskot-textured.glb" download>Unduh GLB</a></nav><script type="importmap">{"imports":{"three":"/vendor/build/three.module.js","three/addons/":"/vendor/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#e9e6df');const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.01,100);camera.position.set(0,2.7,11);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,2.45,0);controls.minDistance=4;controls.maxDistance=20;controls.update();
scene.add(new THREE.HemisphereLight(0xffffff,0x999384,2));for(const [x,y,z,power] of [[-3,7,6,3],[4,4,2,1],[1,6,-4,2]]){const l=new THREE.DirectionalLight(0xffffff,power);l.position.set(x,y,z);scene.add(l);}
const draw=()=>renderer.render(scene,camera);controls.addEventListener('change',draw);
const gltf=await new GLTFLoader().loadAsync('maskot-textured.glb');scene.add(gltf.scene);window.model=gltf.scene;window.modelReady=true;
const meshes=[];gltf.scene.traverse(o=>{if(o.isMesh)meshes.push(o)});document.getElementById('status').textContent=`${meshes.length} bagian · model statis`;
window.setView=which=>{const p={front:[0,2.7,11],side:[11,2.7,0],back:[0,2.7,-11],angle:[5,3.5,10]}[which];camera.position.set(...p);controls.target.set(0,2.45,0);controls.update();draw();};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>window.setView(b.dataset.view));window.setView('front');
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);draw();});
</script></html>
